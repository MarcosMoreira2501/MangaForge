});

/* inputs */
let autosaveTimer = null;
document.addEventListener('input', e => {
  const el = e.target;
  const p = cur();

  if (el.id === 'globalSearch') { runSearch(el.value); return; }
  if (el.dataset && el.dataset.filter === 'ideaq') { state.ideaFilter.q = el.value; render(); return; }

  if (el.matches('[data-scene-body]') && p) {
    const s = p.scenes.find(x => x.id === state.sceneId);
    if (!s) return;
    s.content = el.value;
    s.words = countWords(el.value);
    s.updatedAt = now();
    p.updatedAt = now();
    const wc = $('#wordCount'); if (wc) wc.textContent = s.words;
    const ind = $('#autosave');
    if (ind) { ind.textContent = 'Salvando…'; ind.classList.add('saving'); }
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => {
      save();
      if (ind) { ind.textContent = 'Salvo automaticamente'; ind.classList.remove('saving'); }
    }, 700);
    return;
  }

  if (el.matches('[data-scene-title]') && p) {
    const s = p.scenes.find(x => x.id === state.sceneId);
    if (!s) return;
    s.title = el.value; p.updatedAt = now();
    const item = $('.scene-item.active b'); if (item) item.textContent = el.value || 'Sem título';
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => {
      logEvent(p, 'Título da cena alterado'); save();
      const ind = $('#autosave'); if (ind) ind.textContent = 'Salvo automaticamente';
    }, 800);
    return;
  }

  if (el.matches('[data-scene-chapter]') && p) {
    const s = p.scenes.find(x => x.id === state.sceneId);
    if (!s) return;
    s.chapter = el.value; p.updatedAt = now();
    clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(() => { save(); const ind = $('#autosave'); if (ind) ind.textContent = 'Salvo automaticamente'; }, 800);
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  const p = cur();

  if (el.matches('[data-scene-stage]') && p) {
    const s = p.scenes.find(x => x.id === state.sceneId);
    if (!s) return;
    s.stage = el.value; p.updatedAt = now();
    logEvent(p, 'Cena "' + s.title + '" movida para ' + STAGE_LABEL(el.value));
    save(); render(); return;
  }

  if (el.matches('[data-action="upload-refs"]')) {
    const files = Array.from(el.files || []);
    const pr = cur(); if (!pr || !files.length) return;
    let pending = files.length;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = () => {
        pr.refs.push({ id: uid('r'), type: 'image', title: file.name.replace(/\.[^.]+$/, ''), url: reader.result, note: (Math.round(file.size / 1024)) + ' KB' });
        if (--pending === 0) {
          logEvent(pr, files.length + ' referência(s) adicionada(s)');
          save(); render(); toast('Referências adicionadas');
        }
      };
      reader.readAsDataURL(file);
    });
    el.value = '';
  }
});

/* kanban drag & drop */
document.addEventListener('dragstart', e => {
  const card = e.target.closest('.kcard');
  if (!card) return;
  e.dataTransfer.setData('text/plain', card.dataset.scene);
  card.classList.add('dragging');
});
document.addEventListener('dragend', e => {
  const card = e.target.closest('.kcard');
  card && card.classList.remove('dragging');
  $$('.kcol').forEach(c => c.classList.remove('over'));
});
document.addEventListener('dragover', e => {
  const col = e.target.closest('.kcol');
  if (!col) return;
  e.preventDefault();
  $$('.kcol').forEach(c => c.classList.toggle('over', c === col));
});
document.addEventListener('drop', e => {
  const col = e.target.closest('.kcol');
  if (!col) return;
  e.preventDefault();
  const id = e.dataTransfer.getData('text/plain');
  const p = cur(); if (!p) return;
  const s = p.scenes.find(x => x.id === id);
  if (s) {
    s.stage = col.dataset.stage; s.updatedAt = now(); p.updatedAt = now();
    logEvent(p, 'Cena "' + s.title + '" → ' + STAGE_LABEL(s.stage));
    save(); render(); toast('Cena movida para ' + STAGE_LABEL(s.stage));
  }
  $$('.kcol').forEach(c => c.classList.remove('over'));
});

/* keyboard */
document.addEventListener('keydown', e => {
  const meta = e.metaKey || e.ctrlKey;
  if (meta && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#globalSearch').focus(); }
  if (meta && e.key.toLowerCase() === 'j') { e.preventDefault(); openPanel('capturePanel'); setTimeout(() => $('#capText').focus(), 280); }
  if (e.key === 'Escape') { closePanels(); closeModal(); $('#searchResults').classList.remove('open'); }
  if (meta && e.key === 'Enter' && $('#capturePanel').classList.contains('open')) {
    e.preventDefault();
    document.querySelector('[data-action="save-capture"]').click();
  }
});

/* click-outside for search dropdown */
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) $('#searchResults').classList.remove('open');
}, true);

/* =========================================================
   BOOT
   ========================================================= */
document.documentElement.setAttribute('data-theme', state.theme);
$('#aiChips').innerHTML = ['Gerar nomes', 'Criar um vilão', 'Sugerir um poder', 'Propor reviravolta', 'Desenvolver arco', 'Verificar cronologia']
  .map(c => '<button data-action="ai-prompt" data-q="' + c + '">' + c + '</button>').join('');
$('#aiChips').addEventListener('click', e => {
  const b = e.target.closest('[data-q]');
  if (b) aiSend(b.dataset.q);
});
$('#globalSearch').addEventListener('blur', () => setTimeout(() => $('#searchResults').classList.remove('open'), 180));
$('#globalSearch').addEventListener('focus', e => { if (e.target.value) runSearch(e.target.value); });
$('#aiInput').addEventListener('keydown', e => { if (e.key === 'Enter') aiSend(); });

render();
</script>
</body>
</html>
